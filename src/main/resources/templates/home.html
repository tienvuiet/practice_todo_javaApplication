<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>TODO</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-sm navbar-light bg-light">
  <a class="navbar-brand" href="#">Navbar</a>
  <button class="navbar-toggler d-lg-none" type="button" data-toggle="collapse" data-target="#collapsibleNavId"
          aria-controls="collapsibleNavId"
          aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="collapsibleNavId">
    <ul class="navbar-nav mr-auto mt-2 mt-lg-0">
      <li class="nav-item active">
        <a class="nav-link" href="#">Home <span class="sr-only">(current)</span></a>
      </li>
      <li class="nav-item" th:if="${session.dataLogin == null}">
        <a class="nav-link" th:href="@{/login}" th:text="#{login}"></a>
      </li>
      <li class="nav-item" th:if="${session.dataLogin != null}">
        <a class="nav-link"  th:href="@{/login/logout}" th:text="|#{welcome}  ${session.dataLogin.username} Logout|"></a>
      </li>
     
    </ul>
    <form class="form-inline my-2 my-lg-0">
      <input class="form-control mr-sm-2" type="text" placeholder="Search">
      <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
    </form>
  </div>
</nav>
<a  id="" class="btn btn-primary" th:href="@{/form-create-todo}" role="button">Add todo</a>
<table class="table">
  <thead>
  <tr>
    <th>ID</th>
    <th>Content</th>
    <th>Due date</th>
    <th>Status</th>
    <th>Priority</th>
    <th>Action</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="t : ${todos}">
    <td scope="row" th:text="${t.id}"></td>
    <td th:text="${t.content}"></td>
    <td th:text="${t.dueDate}"></td>
    <td th:text="${t.status}"></td>
    <td th:text="${t.priority}"></td>
    <td>
      <a name="" id="" class="btn btn-primary" th:href="@{|/form-edit-todo/${t.id}|}" role="button">EDIT</a>
    </td>
    <td>
      <a onclick="return confirm('Are you sure ??')" id="" class="btn btn-primary" th:href="@{|/delete/${t.id}|}" role="button">DELETE</a>
    </td>
  </tr>
  </tbody>
</table>
<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
